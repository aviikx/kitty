<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сладких снов 💕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fcf3f6;
    background-image: radial-gradient(#e8b4c4 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: 'Press Start 2P', monospace, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* --- Плавающие сердечки на фоне --- */
  .bg-heart {
    position: absolute;
    color: #e0a3b4;
    font-size: 14px;
    bottom: -20px;
    animation: floatUp linear forwards;
    pointer-events: none;
    user-select: none;
    z-index: 1;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  /* --- КОНВЕРТ --- */
  .envelope {
    width: 90px;
    height: 70px;
    background: #e0a3b4;
    border: 4px solid #9e5f73;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 4px 4px 0px rgba(158, 95, 115, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .envelope::before {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border: 2px solid #c4869b;
    border-radius: 2px;
    pointer-events: none;
  }

  .envelope::after {
    content: '♥';
    color: #9e5f73;
    font-size: 30px;
    font-family: sans-serif;
    animation: pulse 1.5s infinite;
  }

  .envelope:hover {
    transform: scale(1.1) translateY(-5px);
    box-shadow: 6px 6px 0px rgba(158, 95, 115, 0.4);
  }

  .envelope:active {
    transform: scale(0.95);
    box-shadow: 2px 2px 0px rgba(158, 95, 115, 0.4);
  }

  .hint-text {
    margin-top: 25px;
    color: #9e5f73;
    font-size: 10px;
    text-align: center;
    line-height: 1.5;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* --- ОКНО ПИСЬМА --- */
  .letter-window {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0) rotate(-10deg);
    opacity: 0;
    width: 320px;
    background: #f7dbe4;
    border: 4px solid #c4869b;
    border-radius: 8px;
    box-shadow: 8px 8px 0px rgba(158, 95, 115, 0.3);
    padding: 10px;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 20;
  }

  .scene.open .letter-window {
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    opacity: 1;
    pointer-events: auto;
  }

  .scene.open .envelope {
    transform: scale(0) translateY(50px);
    opacity: 0;
    pointer-events: none;
  }

  .window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #e8b4c4;
    padding: 6px 10px;
    border: 2px solid #c4869b;
    margin-bottom: 15px;
  }

  .window-title {
    font-size: 8px;
    color: #7a4356;
    text-transform: uppercase;
  }

  .window-controls {
    font-family: monospace;
    font-size: 14px;
    color: #7a4356;
    letter-spacing: 2px;
  }

  .window-content {
    background: #fcf3f6;
    border: 2px dashed #d19cae;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 15px;
  }

  /* --- КАРТИНКА КОТИКА --- */
  .cat-image {
    width: 140px;
    height: auto;
    image-rendering: pixelated;
    animation: bobbing 1.2s infinite alternate ease-in-out;
    /* Закругление углов, чтобы картинка смотрелась аккуратнее, если у нее есть фон */
    border-radius: 10px; 
  }

  @keyframes bobbing {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }

  /* Текст */
  .main-text {
    font-size: 12px;
    color: #d14b7a;
    line-height: 1.5;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .sub-text {
    font-size: 8px;
    color: #7a4356;
    line-height: 1.8;
    margin-top: 5px;
  }

  /* Кнопка закрыть */
  .close-btn {
    margin-top: 10px;
    background: #f7dbe4;
    border: 2px solid #c4869b;
    color: #7a4356;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: 3px 3px 0px #c4869b;
    transition: all 0.1s;
  }

  .close-btn:hover {
    background: #e8b4c4;
  }

  .close-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 0px 0px 0px #c4869b;
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  
  <!-- Конверт -->
  <div class="envelope" id="envelope" onclick="openLetter()"></div>
  <div class="hint-text" id="hint">Нажми на конверт ✉️</div>

  <!-- Окно с письмом -->
  <div class="letter-window" id="letterWindow">
    <div class="window-header">
      <span class="window-title">LOVE.EXE</span>
      <span class="window-controls">_ □ X</span>
    </div>
    
    <div class="window-content">
      <!-- Теперь здесь прописано cat.jpg -->
      <img src="cat.jpg" 
           alt="Котик с сердечком" 
           class="cat-image" 
           onerror="this.style.display='none'; this.parentNode.insertAdjacentHTML('afterbegin', '<div style=\'font-size: 50px; animation: bobbing 1.2s infinite alternate;\'>🐱</div>');">
      
      <!-- Текст -->
      <div class="main-text">Сладких снов💕</div>
      
      <div class="sub-text">
        Котик уже свернулся клубочком<br>и передает тебе мягкие обнимашки.
      </div>

      <button class="close-btn" onclick="closeLetter(event)">Закрыть</button>
    </div>
  </div>

</div>

<script>
  const scene = document.getElementById('scene');
  const hint = document.getElementById('hint');

  function openLetter() {
    scene.classList.add('open');
    hint.style.display = 'none';
  }

  function closeLetter(event) {
    event.stopPropagation();
    scene.classList.remove('open');
    setTimeout(() => {
      hint.style.display = 'block';
    }, 500);
  }

  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('bg-heart');
    heart.innerHTML = Math.random() > 0.5 ? '♥' : '💕';
    
    heart.style.left = Math.random() * 100 + 'vw';
    const size = Math.random() * 15 + 10;
    heart.style.fontSize = size + 'px';
    const duration = Math.random() * 5 + 3;
    heart.style.animationDuration = duration + 's';
    heart.style.animationDelay = Math.random() * 2 + 's';
    
    document.body.appendChild(heart);
    
    setTimeout(() => {
      heart.remove();
    }, (duration + 3) * 1000);
  }

  // Сердечки летят очень часто (каждые 150 мс)
  setInterval(createHeart, 150);
</script>

</body>
</html>
